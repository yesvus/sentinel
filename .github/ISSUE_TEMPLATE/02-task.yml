name: Task
description: Scoped build work, ready to implement
title: "[task] "
labels: [task]
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Apply the matching P0-P3 label on the right sidebar as well.
      options:
        - P0-critical (do now)
        - P1-high (land soon)
        - P2-medium (normal)
        - P3-low (when convenient)
      default: 2
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - app (pages, components)
        - api (route handlers)
        - db / turso (schema, migrations)
        - auth (sessions, tokens)
        - docs
        - other
      default: 5
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What ships when this closes.
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Plan
      description: Numbered steps, rough is fine.
    validations:
      required: false
